<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- VOYAGO Logo Concept 2: "Data Flow" -->
  <!-- Abstract representation of data flowing through a system (ERP) -->
  <!-- Clean, technical, scalable -->

  <defs>
    <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Central hub (ERP core) -->
  <circle cx="100" cy="100" r="28" fill="url(#nodeGradient)" filter="drop-shadow(0 4px 8px rgba(37,99,235,0.3))"/>

  <!-- Inner pulse -->
  <circle cx="100" cy="100" r="16" fill="none" stroke="url(#flowGradient)" stroke-width="2" stroke-dasharray="4 4">
    <animate attributeName="stroke-dashoffset" from="0" to="16" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Four module nodes (Facturación, Inventario, Contabilidad, RRHH) -->
  <g fill="url(#nodeGradient)" filter="drop-shadow(0 2px 4px rgba(37,99,235,0.2))">
    <!-- Top: Facturación -->
    <circle cx="100" cy="36" r="18">
      <animate attributeName="r" from="0" to="18" dur="0.5s" begin="0.2s" fill="freeze"/>
    </circle>
    <!-- Right: Inventario -->
    <circle cx="164" cy="100" r="18">
      <animate attributeName="r" from="0" to="18" dur="0.5s" begin="0.3s" fill="freeze"/>
    </circle>
    <!-- Bottom: Contabilidad -->
    <circle cx="100" cy="164" r="18">
      <animate attributeName="r" from="0" to="18" dur="0.5s" begin="0.4s" fill="freeze"/>
    </circle>
    <!-- Left: RRHH -->
    <circle cx="36" cy="100" r="18">
      <animate attributeName="r" from="0" to="18" dur="0.5s" begin="0.5s" fill="freeze"/>
    </circle>
  </g>

  <!-- Data flows connecting hub to modules -->
  <g stroke="url(#flowGradient)" stroke-width="4" stroke-linecap="round" fill="none" stroke-dasharray="8 4">
    <path d="M100 64 V 54"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" begin="0.6s" repeatCount="indefinite"/></path>
    <path d="M128 100 H 146"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" begin="0.7s" repeatCount="indefinite"/></path>
    <path d="M100 136 V 146"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" begin="0.8s" repeatCount="indefinite"/></path>
    <path d="M54 100 H 36"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" begin="0.9s" repeatCount="indefinite"/></path>
  </g>

  <!-- Module icons (simplified) -->
  <g fill="white" font-size="10" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, sans-serif" font-weight="bold">
    <text x="100" y="37.5">📄</text>
    <text x="164" y="101.5">📦</text>
    <text x="100" y="165.5">💰</text>
    <text x="36" y="101.5">👥</text>
  </g>

  <!-- Outer orbit particles (data points) -->
  <g fill="url(#flowGradient)">
    <circle cx="100" cy="16" r="4" opacity="0.6"><animate attributeName="opacity" from="0" to="0.6" dur="1s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="184" cy="100" r="4" opacity="0.6"><animate attributeName="opacity" from="0" to="0.6" dur="1s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="184" r="4" opacity="0.6"><animate attributeName="opacity" from="0" to="0.6" dur="1s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="16" cy="100" r="4" opacity="0.6"><animate attributeName="opacity" from="0" to="0.6" dur="1s" begin="1.3s" repeatCount="indefinite"/></circle>
  </g>
</svg>