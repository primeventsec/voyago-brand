<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="VOYAGO">
  <title>VOYAGO — marca</title>
  <defs>
    <clipPath id="disk">
      <circle cx="100" cy="100" r="88"/>
    </clipPath>
  </defs>

  <!-- Disco: cielo y tierra -->
  <g clip-path="url(#disk)">
    <rect x="0" y="0" width="200" height="100" fill="#2563eb"/>
    <rect x="0" y="100" width="200" height="100" fill="#16a34a"/>
  </g>

  <!-- Línea ecuatorial -->
  <line x1="12" y1="100" x2="188" y2="100" stroke="#f97316" stroke-width="7" stroke-linecap="round"/>

  <!-- Sol, separado de la línea por un anillo del color de fondo -->
  <circle cx="100" cy="100" r="27" fill="#f97316" stroke="#ffffff" stroke-width="6"/>
</svg>
